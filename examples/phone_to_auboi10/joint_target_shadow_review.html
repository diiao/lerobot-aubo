<!doctype html><meta charset="utf-8"><title>静止目标对照：可见区域选择</title>
<style>body{font:16px sans-serif;max-width:1000px;margin:24px auto;background:#f5f6f8;color:#17212b}canvas{border:1px solid #888;max-width:100%;cursor:crosshair}button,select{font:inherit;margin:5px;padding:7px}p{line-height:1.6}</style>
<h1>静止观察：选择各目标的可见区域</h1>
<p>本页只标记这张已保存的图像，不控制机械臂。依次沿竹条可见边缘点击，按“结束当前多边形”闭合。遮挡两侧可分别画多个多边形；不要补画被遮挡部分。每个身份必须是不同竹条；新的一次抓取重新拍照和圈选。</p>
<label>可见竹条数 <select id="count"><option>1</option><option selected>2</option><option>3</option></select></label><br>
<select id="target"><option value="0">目标 A（紫色）</option><option value="1">目标 B（青色）</option></select><label>身份 <input id="identity" value="A"></label>
<button id="finish">结束当前多边形</button><button id="undo">撤销当前点</button><button id="clear">清空所选目标</button><br>
<canvas width="640" height="480" id="view"></canvas>
<p><label><input type="checkbox" id="confirm">我已检查各身份分别标记不同竹条的可见区域，没有补画遮挡或混入夹爪。</label></p>
<button id="save">导出选择文件</button><p id="status"></p>
<script>
const snapshot='__SNAPSHOT_ID__',canvas=document.querySelector('#view'),ctx=canvas.getContext('2d'),image=new Image();
let selected=0,current=[],polygons=[[],[]],names=['A','B'];const colors=['#ff00ff','#00bcd4','#ffb000'];
function draw(){ctx.drawImage(image,0,0);for(let i=0;i<polygons.length;i++){ctx.strokeStyle=colors[i];ctx.lineWidth=2;for(const p of polygons[i]){ctx.beginPath();p.forEach(([x,y],j)=>j?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.stroke()}}ctx.strokeStyle=colors[selected];ctx.beginPath();current.forEach(([x,y],j)=>j?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();for(const [x,y]of current){ctx.fillStyle=colors[selected];ctx.fillRect(x-2,y-2,4,4)}document.querySelector('#status').textContent=names.map((name,i)=>name+'：'+polygons[i].length+' 个区域').join('；')}
image.onload=draw;image.src='global_rgb.png';
canvas.onclick=e=>{let r=canvas.getBoundingClientRect();current.push([Math.max(0,Math.min(639,Math.round((e.clientX-r.left)*640/r.width))),Math.max(0,Math.min(479,Math.round((e.clientY-r.top)*480/r.height)))]);document.querySelector('#confirm').checked=false;draw()};
document.querySelector('#finish').onclick=()=>{if(current.length<3)return alert('至少需要三个点');polygons[selected].push(current);current=[];document.querySelector('#confirm').checked=false;draw()};
document.querySelector('#undo').onclick=()=>{current.pop();draw()};
document.querySelector('#clear').onclick=()=>{polygons[selected]=[];current=[];document.querySelector('#confirm').checked=false;draw()};
document.querySelector('#target').onchange=e=>{if(current.length){e.target.value=selected;return alert('请先结束当前多边形或撤销所有点')}selected=Number(e.target.value);document.querySelector('#identity').value=names[selected];draw()};
document.querySelector('#count').onchange=e=>{if(!confirm('更改数量会清空本页尚未导出的圈选，是否继续？')){e.target.value=polygons.length;return}const n=Number(e.target.value);polygons=Array.from({length:n},()=>[]);names=['A','B','C'].slice(0,n);current=[];selected=0;const select=document.querySelector('#target');select.replaceChildren();names.forEach((name,i)=>{const o=document.createElement('option');o.value=i;o.textContent='目标 '+name;select.append(o)});document.querySelector('#identity').value=names[0];document.querySelector('#confirm').checked=false;draw()};
document.querySelector('#identity').onchange=e=>{const name=e.target.value.trim();if(!name||names.some((x,i)=>i!==selected&&x===name)){e.target.value=names[selected];return alert('身份不能为空或重复')}names[selected]=name;document.querySelector('#target').options[selected].textContent='目标 '+name;document.querySelector('#confirm').checked=false;draw()};
document.querySelector('#save').onclick=()=>{if(current.length||!polygons.every(p=>p.length)||!document.querySelector('#confirm').checked)return alert('请完成全部可见目标并勾选实际复核确认');let data={schema:'joint_target_shadow_selection',snapshot_id:snapshot,human_reviewed:true,targets:polygons.map((p,i)=>({target_id:names[i],polygons:p}))};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='target_shadow_'+snapshot+'_selection.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script>
